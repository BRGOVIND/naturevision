name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests must never depend on a live external service. The suite runs against
  # an in-memory imagery provider and SQLite, so CI is deterministic and works
  # on a fork without secrets.
  DATABASE_URL: sqlite+aiosqlite:///./ci.db
  GROQ_API_KEY: ""

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check app training tests research
          ruff format --check app training tests research

      - name: Type check
        run: mypy app training research

      - name: Tests
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      # Structural validation of the research layer only. The full benchmark
      # fetches imagery and is triggered manually, never on every pull request.
      - name: Research configuration and split validation
        run: python -m research.run --experiment smoke

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: naturevision-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: naturevision-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the backend image
        run: |
          docker run -d --name nv-backend \
            -e DATABASE_URL=sqlite+aiosqlite:///./smoke.db \
            -p 8000:8000 naturevision-backend:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /tmp/health.json; then
              echo "Service is healthy:"; cat /tmp/health.json; exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"; docker logs nv-backend; exit 1

      - name: Collect backend logs
        if: always()
        run: docker logs nv-backend || true
